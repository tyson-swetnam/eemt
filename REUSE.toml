# SPDX-FileCopyrightText: 2026 Tyson Lee Swetnam
# SPDX-License-Identifier: BSD-3-Clause
#
# Licensing of files that cannot, or must not, carry an in-file header.
# Checked by `reuse lint` (REUSE specification 3.3, reuse 6.3.0).
#
# Rules
# - Source files carry their own two-line header (copyright with the year of
#   the file's first commit, then the licence): BSD-3-Clause everywhere,
#   GPL-2.0-or-later under rsun/. They are deliberately NOT matched here, so a
#   new source file without a header fails the lint. There is no catch-all.
# - This file covers Markdown (frontmatter must stay first), everything under
#   docs/, notebooks, JSON, lock files, binaries and third-party material.
#   The copyright year in these tables is the year of the project's LICENSE
#   notice, not of each file.
# - When several tables match a file, the LAST one wins. Keep the general
#   tables above the specific ones.
# - precedence = "override" ignores anything inside the file that looks like a
#   copyright or licence tag (prose that quotes one, byte noise in binaries).
# - A new file that fits none of these tables and cannot take a header gets a
#   `<name>.license` sidecar file, or a table here.

version = 1

# --- Project files without headers: BSD-3-Clause ---------------------------

[[annotations]]
path = ["*.md", "**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["**/*.ipynb", "**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

# Lock files and tool-owned files: regenerated or parsed by tools, so a header
# would be lost or is not allowed. The hashed requirements*.txt files are
# rewritten by scripts/locks/refresh.sh, which also writes
# scripts/locks/inputs.sha256 (sha256sum format, no comments allowed);
# docker/VERSION is read as a bare version string.
[[annotations]]
path = [
    ".gitignore",
    "**/.gitignore",
    "web-interface/requirements.txt",
    "requirements-docs.txt",
    "requirements-dev.txt",
    "**/*-lock.yml",
    "scripts/locks/inputs.sha256",
    "lean4-verification/lean-toolchain",
    "docker/VERSION",
]
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

# Helm templates are Go-template text, not YAML: a leading "#" comment would be
# rendered into every manifest, so they are annotated here instead.
[[annotations]]
path = "docker/kubernetes/helm/eemt/templates/**"
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

# Generated by lean4-verification/generate_report.py.
[[annotations]]
path = "lean4-verification/EEMT_Lean4_Verification_Report.pdf"
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

# --- Generated SBOMs: CC0-1.0 ------------------------------------------------
# SPDX 2.3 requires dataLicense CC0-1.0 for SPDX documents; the CycloneDX twins and
# the manifest carry the same data, so the whole generated tree uses it.
# sbom/README.md is Markdown and stays BSD-3-Clause (table above).
[[annotations]]
path = ["sbom/*.json", "sbom/SOURCE_DATE_EPOCH"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Tyson Lee Swetnam"
SPDX-License-Identifier = "CC0-1.0"

# --- rsun: GPL-2.0-or-later (rsun/README.md, "License") ---------------------

[[annotations]]
path = ["rsun/Cargo.lock", "rsun/*.md", "rsun/**/*.md", "rsun/**/*.json"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "GPL-2.0-or-later"

# --- Documentation: CC-BY-4.0 (docs/license.md, "Documentation License") ----
# Nothing under docs/ carries a header; these tables are its only licensing.

[[annotations]]
path = "docs/**"
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "CC-BY-4.0"

# Site code shipped with the documentation is software, not prose.
[[annotations]]
path = ["docs/javascripts/**", "docs/stylesheets/**", "docs/overrides/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Tyson Lee Swetnam"
SPDX-License-Identifier = "BSD-3-Clause"

# Adapted from the Contributor Covenant 2.0, which is published under CC BY 4.0
# (https://www.contributor-covenant.org/).
[[annotations]]
path = "docs/code_of_conduct.md"
precedence = "override"
SPDX-FileCopyrightText = [
    "Contributor Covenant authors (https://www.contributor-covenant.org/version/2/0/code_of_conduct/)",
    "2019 Tyson Lee Swetnam",
]
SPDX-License-Identifier = "CC-BY-4.0"

# --- Third-party material: never the repository licence ---------------------
