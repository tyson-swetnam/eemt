[[finding]]
id = "F-A-023"
title = "The conda-forge GCC runtime packages in the image ship only the GCC runtime-library exception, not the GPL-3.0 text it modifies"
location = ["docker/workflow/Dockerfile:36"]
severity = "low"
status = "confirmed"
evidence = """In eemt:3.0.0, 213 of 225 packages have info/licenses, copied to /opt/eemt/share/licenses. Without: \
libgcc, libgcc-ng, libgomp, libstdcxx, libstdcxx-ng, libgfortran, libgfortran5 (GPL-3.0-only WITH \
GCC-exception-3.1; they install only share/licenses/*/RUNTIME.LIBRARY.EXCEPTION), libfreetype and libfreetype6 \
(covered by the freetype package's licence directory), libsqlite and sqlite (public domain), libglu (SGI-B-2.0, \
no text). A GPL-3.0 text is in the image under the ld_impl_linux-64, readline and wget licence directories. GRASS \
(GPL-2.0-or-later) and ndcctools (GPL-2.0-only) ship COPYING."""
