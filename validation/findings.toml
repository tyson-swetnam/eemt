title = "SAGA GIS is in neither the old nor the new workflow image, so eemt/eemt/twi.sh (saga_cmd) cannot run"
location = ["eemt/eemt/twi.sh:14"]
severity = "medium"
status = "deferred"
evidence = """`command -v saga_cmd` -> not found in eemt:3.0.0; the old Dockerfile never installed SAGA either. SAGA is \
not packaged on conda-forge (saga, saga-gis, libsaga, saga-cmd all 404 on anaconda.org); Ubuntu 26.04 has an apt \
saga 9.9.3, which the no-apt, hash-locked runtime does not take."""
