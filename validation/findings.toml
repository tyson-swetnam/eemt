#
# Findings ledger for the EEMT validation effort.
#
# One [[finding]] table per confirmed or suspected defect. The rendered report
# is generated from this file together with equations/decisions.toml; do not
# edit the rendered report by hand.
#
# Fields
#   id        "F-<area>-<nnn>", area is A (containers, locks, SBOM),
#             B (equations and Lean), C (code and workflow managers), D (docs).
#             Ids are never reused.
#   title     One sentence stating the defect.
#   location  List of "path:line" strings, relative to the repository root.
#   severity  "high" | "medium" | "low"
#   status    "suspected"  reported by a reader, not yet reproduced
#             "confirmed"  reproduced by a failing test or a recorded run
#             "refuted"    checked and found not to be a defect (keep the entry)
#             "fixed"      fix merged on the area branch; fix_commit is set
#             "deferred"   confirmed, deliberately not fixed; reason is set
#   evidence  How it was established: the command and decisive output, or a
#             path to a recorded run.
#   test      Path (and test id) of the regression test that fails before the
#             fix and passes after it. Required once status is "fixed".
#   changes_scientific_output
#             true when the fix changes any number a pipeline writes.
#   sdr       "SDR-<nnn>" in equations/decisions.toml. Required when
#             changes_scientific_output is true; such a fix is not merged
#             until that decision is approved by the repository owner.
#   fix_commit  Abbreviated commit hash of the fix. Empty until fixed.
#   reason    Why a finding is "refuted" or "deferred". Empty otherwise.
#
# Entries may quote copyright and licence notices found in other files. The
# marker on the next line stops `reuse lint` from reading those quotations as
# licensing statements about this file; keep it above the first entry.
# REUSE-IgnoreStart
#
# Example (commented out so the ledger starts empty):
#
# [[finding]]
# id = "F-C-001"
# title = "Monthly day table omits day 151, so 31 May is never summed"
# location = ["sol/sol/run-workflow:32", "eemt/eemt/run-workflow:25"]
# severity = "high"
# status = "confirmed"
# evidence = "tests/workflow/test_calendar.py::test_month_table_partitions_year fails on master"
# test = "tests/workflow/test_calendar.py::test_month_table_partitions_year"
# changes_scientific_output = true
# sdr = "SDR-018"
# fix_commit = ""
# reason = ""

schema = 1

# --- Area A: containers, locks, SBOM, licensing ------------------------------

[[finding]]
id = "F-A-001"
title = "rsun-cli declares no licence in its Cargo.toml, unlike the other five rsun crates"
location = ["rsun/rsun-cli/Cargo.toml:5"]
severity = "low"
status = "confirmed"
evidence = """`cargo metadata --format-version 1 --locked` in rsun/ (rust 1.100.0 image pulled by digest): \
rsun-cli license = null; rsun-core, rsun-cuda, rsun-gpu, rsun-py and rsun-wasm license = "GPL-2.0-or-later". \
rsun/README.md ("License") states GPL-2.0-or-later for the whole tree, and rsun-cli links rsun-core, so the \
file headers under rsun/rsun-cli say GPL-2.0-or-later. The Cargo.toml `license` field was left alone: \
the owner adds it (one line)."""
test = ""
changes_scientific_output = false
sdr = ""
fix_commit = ""
reason = ""

[[finding]]
id = "F-A-002"
title = "Five journal and conference PDFs under pdfs/ are publisher copyright with no licence to redistribute"
location = [
    "pdfs/pelletier_etal_2017.pdf",
    "pdfs/rasmussen_etal_2005.pdf",
    "pdfs/rasmussen_etal_2014.pdf",
    "pdfs/rasmussen_etal_2015.pdf",
    "pdfs/swetnam_etal_2016.pdf",
]
severity = "high"
status = "confirmed"
evidence = """`pdftotext -l 3 <file> -` rights notices: pelletier_etal_2017 "Copyright (c) 2017 John Wiley & Sons, Ltd." \
(doi:10.1002/esp.4306, page footer "Downloaded from https://onlinelibrary.wiley.com ... by University Of Arizona \
Library"); rasmussen_etal_2005 "(c) Soil Science Society of America ... All copyrights reserved" \
(doi:10.2136/sssaj2003.0283); rasmussen_etal_2014 "(c) Soil Science Society of America ... All rights reserved" \
(doi:10.2136/vzj2014.07.0102); rasmussen_etal_2015 "(c) Springer Science+Business Media B.V. 2010" \
(doi:10.1007/s10533-010-9476-8); swetnam_etal_2016 "(c) 2016 ACM ... to post on servers or to redistribute to \
lists, requires prior specific permission" (doi:10.1145/2949550.2949573). No licence text permitting \
redistribution is in any of the five. They are annotated LicenseRef-third-party-publication in REUSE.toml, not \
the repository licence. The other three PDFs (rasmussen_2010, rasmussen_gallo_2013, zapata-rios_etal_2016) print \
"(c) Author(s) <year>. CC Attribution 3.0 License." on page 1 and are annotated CC-BY-3.0. File names do not \
match the articles: rasmussen_2010.pdf is HESS 16 (2012), rasmussen_etal_2014.pdf is Vadose Zone J. \
vzj2014.07.0102, rasmussen_etal_2015.pdf is Biogeochemistry 102 (2011), pelletier_etal_2017.pdf is ESPL 43 (2018). \
Owner decision: confirm the right to redistribute each of the five, or replace them with DOI links (removing \
them from the tree does not remove them from history)."""
test = ""
changes_scientific_output = false
sdr = ""
fix_commit = ""
reason = ""

