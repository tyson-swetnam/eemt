[[finding]]
id = "F-A-004"
title = "rsun is a port of GRASS GIS r.sun but carries none of the upstream copyright notices"
location = [
    "rsun/rsun-core/src/lib.rs:23",
    "rsun/rsun-core/src/radiation.rs:7",
    "rsun/rsun-core/src/solar.rs:6",
    "rsun/rsun-gpu/src/shaders/radiation.wgsl:8",
    "rsun/rsun-cli/src/main.rs:12",
]
severity = "medium"
status = "confirmed"
evidence = """The sources say so themselves: "Ported from GRASS GIS r.sun rsunlib.c brad() and drad() functions" \
(radiation.rs:7), "Ported from GRASS GIS r.sun rsunlib.c (Hofierka & Suri 2002)" (solar.rs:6, radiation.wgsl:8), \
"Ported from GRASS GIS r.sun joules2() + calculate()" (lib.rs:23). GRASS 8.5.0 raster/r.sun/rsunlib.c opens with \
"(C) 2002 Copyright Jaro Hofierka, Gresaka 22, 085 01 Bardejov, Slovakia, and GeoModel, s.r.o., Bratislava, \
Slovakia" and "(C) 2011 by Hamish Bowman, and the GRASS Development Team", under GPL version 2 or later. \
`git grep -n -i -E 'hofierka|GRASS Development Team' -- rsun` finds only the two "Hofierka & Suri 2002" citations \
and the README reference list; no upstream copyright line. The licence chosen for rsun (GPL-2.0-or-later) matches \
upstream; what is missing is the retained notice. The header sweep added only the repository owner's line. \
Owner decision: add the upstream copyright lines to the ported files (and say which files are ports)."""
test = ""
changes_scientific_output = false
sdr = ""
fix_commit = ""
reason = ""

