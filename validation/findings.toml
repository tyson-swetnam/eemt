[[finding]]
id = "F-A-013"
title = "The old workflow image set GISBASE to /usr/lib/grass84, a directory that did not exist, so `grass` crashed in the image's default environment"
location = ["docker/ubuntu/24.04/Dockerfile:61", "docker/ubuntu/24.04/Dockerfile:78"]
severity = "high"
status = "fixed"
evidence = """The image installed Ubuntu 24.04's apt GRASS 8.3.2 (`dpkg -l`: grass-core 8.3.2-1ubuntu2), whose GISBASE \
is /usr/lib/grass83, while the Dockerfile exported /usr/lib/grass84 (file present at bd19386). In \
eemt:legacy-e7637f45c202 with the image's environment: `ls /usr/lib/grass84` -> No such file or directory; \
`grass --version` -> FileNotFoundError: '/usr/lib/grass84/etc/license'; `which r.sun` -> nothing (only \
/usr/lib/grass83/bin/r.sun exists). S1 had to override GISBASE, LD_LIBRARY_PATH and PATH to run any module. \
GRASS 8.3.2 also echoes $GISBASE for `grass --config path`, so the value was never checked. New image: GISBASE \
/opt/eemt/env/lib/grass85 is static ENV, and the build fails unless it equals `grass --config path` (which in GRASS \
8.5.0 ignores the environment: with GISBASE=/wrong it still prints /opt/eemt/env/lib/grass85). \
docker/workflow/eemt-selftest run inside the legacy image: 7 of 8 checks fail (versions, environment, \
python-imports, rsun-module, epsg-lookup, rsun-day, makeflow-local); inside eemt:3.0.0: 0 fail, also as UID \
12345 with a read-only root filesystem and with the entrypoint bypassed."""
test = "docker/workflow/eemt-selftest (checks: versions, environment, rsun-module, rsun-day); build-time RUN assertions in docker/workflow/Dockerfile"
changes_scientific_output = false
sdr = ""
fix_commit = "c5843c4"
reason = ""

