#
# The conda-lock environment that scripts/locks/refresh.sh solves the conda locks with.
# It is itself locked (locktool-lock.yml, sha256 per package) and installed from that
# lock, so the solver does not change between refreshes. Not shipped in any image.
name: locktool
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  - python=3.13
  - conda-lock=4.1.0
