#
# Variables (shell environment or a .env file next to this file):
#   EEMT_VERSION     image tag of eemt:<EEMT_VERSION>, eemt-web:<EEMT_VERSION> and
#                    eemt-docs:<EEMT_VERSION>; keep equal to docker/VERSION (default 3.0.0).
#                    Build them with docker/build.sh [workflow|web|docs].
#   EEMT_UID         UID the web container runs as (default 1000)
#   EEMT_GID         GID the web container runs as (default 1000)
#   EEMT_DOCKER_GID  group that owns /var/run/docker.sock (default 999). The web container
#                    launches workflow containers through the socket, so for real workflows
#                    set EEMT_DOCKER_GID=$(stat -c %g /var/run/docker.sock); it is added to
#                    the container's groups (group_add) and baked in as the image's docker
#                    group at build time.

version: '3.8'

services:
  # EEMT Web Interface (Local Mode)
  eemt-web:
    image: eemt-web:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/web-interface/Dockerfile
      args:
        EEMT_VERSION: ${EEMT_VERSION:-3.0.0}
        EEMT_UID: ${EEMT_UID:-1000}
        EEMT_GID: ${EEMT_GID:-1000}
        EEMT_DOCKER_GID: ${EEMT_DOCKER_GID:-999}
    container_name: eemt-web-local
    user: "${EEMT_UID:-1000}:${EEMT_GID:-1000}"
    group_add:
      - "${EEMT_DOCKER_GID:-999}"  # group of /var/run/docker.sock (see top)
    ports:
      - "5000:5000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/results:/app/results
      - ./data/temp:/app/temp
      - ./data/cache:/app/cache
      - ./data/logs:/app/logs  # Mount logs directory to fix permission issues
      - ./data:/host/data:rw  # Mount entire host data directory for workflow container paths
      - /var/run/docker.sock:/var/run/docker.sock  # For container management
      - ./web-interface/containers:/app/containers:rw  # Mount workflow manager for development
      - ./sol:/opt/eemt/sol:ro  # Mount workflow scripts
      - ./eemt:/opt/eemt/eemt:ro  # Mount workflow scripts
    environment:
      - EEMT_MODE=local
      - EEMT_HOST=0.0.0.0
      - EEMT_PORT=5000
      - REAL_WORKFLOWS=true  # Enable real workflow execution
      - EEMT_WORKFLOW_IMAGE=eemt:${EEMT_VERSION:-3.0.0}  # Image for workflow containers
      - EEMT_HOST_DATA_DIR=${PWD}/data  # Absolute path to host data directory
      # Cleanup configuration (disabled due to cron user issues)
      - EEMT_CLEANUP_ENABLED=false
      - EEMT_SUCCESS_RETENTION_DAYS=7
      - EEMT_FAILED_RETENTION_HOURS=12
    networks:
      - eemt-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # EEMT Master Node (Distributed Mode)
  eemt-master:
    image: eemt-web:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/web-interface/Dockerfile
      args:
        EEMT_VERSION: ${EEMT_VERSION:-3.0.0}
        EEMT_UID: ${EEMT_UID:-1000}
        EEMT_GID: ${EEMT_GID:-1000}
        EEMT_DOCKER_GID: ${EEMT_DOCKER_GID:-999}
    container_name: eemt-master
    ports:
      - "5000:5000"  # Web interface
      - "9123:9123"  # Work Queue port
    volumes:
      - ./data/shared:/app/shared
      - ./data/uploads:/app/uploads
      - ./data/results:/app/results
      - ./data/temp:/app/temp
      - ./data/cache:/app/cache
    environment:
      - EEMT_MODE=master
      - EEMT_HOST=0.0.0.0
      - EEMT_PORT=5000
      - WORK_QUEUE_PORT=9123
      - WORK_QUEUE_PROJECT=EEMT-Docker
      - EEMT_WORKFLOW_IMAGE=eemt:${EEMT_VERSION:-3.0.0}
      - MAX_WORKERS=10
      # Cleanup configuration
      - EEMT_CLEANUP_ENABLED=true
      - EEMT_SUCCESS_RETENTION_DAYS=7
      - EEMT_FAILED_RETENTION_HOURS=12
    command: >
      bash -c "
        python scripts/start-master.py 
        --work-dir /app 
        --port 9123 
        --project EEMT-Docker 
        --max-workers 10 
        --web-interface 
        --web-port 5000
      "
    networks:
      - eemt-network
    profiles:
      - distributed
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # EEMT Worker Node
  # Not functional with the eemt:3.x workflow image: scripts/start-worker.py imports the web
  # interface's workflow manager, which needs the docker and psutil packages the image does
  # not contain (validation/findings.toml F-A-019).
  eemt-worker:
    image: eemt:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/workflow/Dockerfile
    volumes:
      - ./data/shared:/data/shared
      - ./data/cache:/data/cache
      - ./scripts:/scripts:ro
      - ./web-interface:/web-interface:ro
    environment:
      - MASTER_HOST=eemt-master
      - MASTER_PORT=9123
      - WORKER_CORES=4
      - WORKER_MEMORY=8G
      - WORKER_DISK=50G
      - PYTHONPATH=/web-interface
    command: >
      python /scripts/start-worker.py
      --master-host eemt-master
      --master-port 9123
      --cores 4
      --memory 8G
      --disk 50G
      --work-dir /tmp/eemt-worker
    networks:
      - eemt-network
    profiles:
      - distributed
    deploy:
      resources:
        limits:
          cpus: '8.0'  # High CPU for geospatial processing
          memory: 16G  # High memory for large DEMs
        reservations:
          cpus: '4.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-v", "grep", "|", "grep", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Additional Worker Nodes (Scale as needed)
  # Note: Use --scale eemt-worker-extra=N to scale workers
  eemt-worker-extra:
    image: eemt:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/workflow/Dockerfile
    volumes:
      - ./data/shared:/data/shared
      - ./data/cache:/data/cache
      - ./scripts:/scripts:ro
      - ./web-interface:/web-interface:ro
    environment:
      - MASTER_HOST=eemt-master
      - MASTER_PORT=9123
      - WORKER_CORES=4
      - WORKER_MEMORY=8G
      - WORKER_DISK=50G
      - PYTHONPATH=/web-interface
    command: >
      python /scripts/start-worker.py
      --master-host eemt-master
      --master-port 9123
      --cores 4
      --memory 8G
      --disk 50G
      --work-dir /tmp/eemt-worker
    networks:
      - eemt-network
    profiles:
      - distributed
      - scale
    deploy:
      resources:
        limits:
          cpus: '8.0'  # High CPU for geospatial processing
          memory: 16G  # High memory for large DEMs
        reservations:
          cpus: '4.0'
          memory: 8G
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "-v", "grep", "|", "grep", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Documentation Server (Zensical; serves the mounted zensical.toml and docs/)
  eemt-docs:
    image: eemt-docs:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
      args:
        EEMT_VERSION: ${EEMT_VERSION:-3.0.0}
    container_name: eemt-docs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./zensical.toml:/site-src/zensical.toml:ro
      - ./docs:/site-src/docs:ro
    networks:
      - eemt-network
    profiles:
      - docs

  # Dedicated Cleanup Service (Optional)
  eemt-cleanup:
    image: eemt-web:${EEMT_VERSION:-3.0.0}
    build:
      context: .
      dockerfile: docker/web-interface/Dockerfile
      args:
        EEMT_VERSION: ${EEMT_VERSION:-3.0.0}
        EEMT_UID: ${EEMT_UID:-1000}
        EEMT_GID: ${EEMT_GID:-1000}
        EEMT_DOCKER_GID: ${EEMT_DOCKER_GID:-999}
    container_name: eemt-cleanup
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/results:/app/results
      - ./data/temp:/app/temp
      - ./data/cache:/app/cache
      - ./web-interface/jobs.db:/app/jobs.db  # Share database with web interface
    environment:
      - EEMT_SUCCESS_RETENTION_DAYS=7
      - EEMT_FAILED_RETENTION_HOURS=12
      - EEMT_CLEANUP_ENABLED=true
      - EEMT_CLEANUP_INTERVAL_SECONDS=86400  # once a day, counted from container start
    # The image has no cron daemon: a shell loop runs the cleanup at a fixed interval.
    command: >
      bash -c "
        echo 'EEMT Dedicated Cleanup Service';
        python3 cleanup_jobs.py --dry-run;
        while true; do
          sleep $${EEMT_CLEANUP_INTERVAL_SECONDS};
          python3 cleanup_jobs.py >> /app/logs/cleanup.log 2>&1 || echo 'cleanup run failed';
        done
      "
    networks:
      - eemt-network
    profiles:
      - cleanup
    restart: unless-stopped

networks:
  eemt-network:
    driver: bridge

volumes:
  eemt-data:
    driver: local