#
# Full notebook / GIS workstation environment (conda-forge only).
# Locked in notebooks/conda-lock.yml (sha256 per package); install from the lock:
#   micromamba create -n eemt-gis -f notebooks/conda-lock.yml
#   (or: conda-lock install -n eemt-gis notebooks/conda-lock.yml)
# After editing this file run `scripts/locks/refresh.sh conda`.
#
# Versions shared with the workflow image (docker/workflow/conda-lock.yml) are pinned to
# the same releases, so notebooks and pipelines run the same GRASS, GDAL, PROJ, GEOS,
# Python and NumPy; `scripts/locks/check.sh locks` compares them.
# HDF5 cannot follow: the PDAL library here needs hdf5 1.14 (the image, without PDAL, has
# 2.2), so packages built on it (libgdal-hdf5, libnetcdf, netcdf4) are other builds of the same
# versions. Other transitive libraries may differ; check.sh compares the exact pins only.
name: eemt-gis
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  # Core Python (same as the workflow image)
  - python=3.14.10
  - pip

  # Geospatial core (same as the workflow image). GRASS GIS comes from conda-forge;
  # the former install_grass.sh / install_qgis.sh source builds are gone.
  - grass=8.5.0
  - gdal=3.12.3
  - libgdal-core=3.12.3
  - proj=9.7.1
  - geos=3.14.1
  - pdal>=2.8
  - libspatialite>=5.1
  - libspatialindex>=1.9

  # Python scientific stack
  - numpy=2.5.4
  - pandas>=2.1
  - xarray>=2024.1
  - rasterio>=1.4
  - geopandas>=0.14
  - fiona>=1.9
  - shapely>=2.0
  - pyproj>=3.6
  - cartopy>=0.22
  - sympy             # 01_background/*.ipynb
  - laspy             # gordon_gulch_eemt_report.ipynb
  - pyvista           # 01_background/02_solar_topography.ipynb

  # Visualization
  - matplotlib>=3.8
  - seaborn           # 01_background/*.ipynb
  - plotly>=5.17
  - bokeh>=3.3
  - contextily>=1.4
  - folium>=0.15

  # Analysis and processing
  - scipy>=1.11
  - scikit-image>=0.22
  - scikit-learn>=1.3
  - dask>=2024.1
  - distributed>=2024.1

  # Jupyter and notebook tools
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - ipyleaflet>=0.17
  - voila>=0.5

  # Climate and Earth system data (netcdf4 same as the workflow image)
  - netcdf4=1.7.4
  - h5py>=3.10
  - zarr>=2.16
  - cfgrib>=0.9
  - ecmwf-api-client>=1.6

  # Additional utilities
  - requests>=2.31
  - tqdm>=4.66
  - pyyaml>=6.0
  - click>=8.1
  - rich>=13.7

  # Development tools
  - pytest>=7.4
  - black>=23.9
  - flake8>=6.1
  - mypy>=1.6

  # PyPI-only packages (locked with sha256 by conda-lock as well)
  - pip:
    - grass-session>=0.5  # Python GRASS interface
    - elevation>=1.1      # DEM download utilities
